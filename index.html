<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141416"><meta name="description" content="A quiet place for your daily habits. Track your week, one check at a time."><title>Habit Tracker</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;background:#141416;color:#f5f5f7}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 16px}main{width:min(100%,760px)}.widget{background:linear-gradient(130deg,#2b2b2e,#252527);border:1px solid #ffffff09;border-radius:32px;padding:30px 28px 22px;box-shadow:0 24px 80px #0005}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:29px}h1{font-size:23px;font-weight:600;letter-spacing:-.7px;margin:0}#count{font-size:14px;color:#a6a6ac;font-variant-numeric:tabular-nums}.table-head,.habit{display:grid;grid-template-columns:48px minmax(0,1fr) 32px 210px 38px;gap:12px;align-items:center}.table-head{margin-bottom:5px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.day{text-align:center;color:#9b9ba1;font-size:13px;font-weight:500}.day:last-child{color:#f8f8fa}.habit{min-height:64px}.streak{font-size:14px;color:#b3b3ba;white-space:nowrap;font-variant-numeric:tabular-nums}.streak span{filter:grayscale(1);opacity:.8;margin-right:4px}.name{font-size:17px;font-weight:500;letter-spacing:-.4px;line-height:1.3}.emoji{margin-right:8px}.score{color:#9dde88;font-size:15px;font-weight:500;text-align:center}.cell{aspect-ratio:1;border:1.5px solid #6d6d73;border-radius:4px;background:transparent;display:block;width:100%;padding:0;cursor:pointer;transition:background .16s,border-color .16s}.cell.done{background:#a2a2a8;border-color:#a2a2a8}.cell.today{border-color:#a2a2a8}.check{border:1.5px solid #77777e;color:#8e8e95;background:none;border-radius:50%;width:32px;height:32px;padding:6px;cursor:pointer;display:grid;place-items:center;transition:all .18s}.check.done{background:#e3e3e8;border-color:#e3e3e8;color:#303034}.check svg{width:18px;height:18px}.check:hover{border-color:#f0f0f5}.cell:hover{border-color:#f0f0f5}button:focus-visible{outline:2px solid #b9efa7;outline-offset:4px}footer{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #ffffff0c;margin-top:20px;padding-top:17px;color:#a2a2aa;font-size:12px}.caption{text-align:center;color:#96969e;font-size:13px;margin:21px 0 0;line-height:1.6}.live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:640px){.widget{padding:24px 18px 19px;border-radius:28px}header{margin-bottom:23px}h1{font-size:20px}.table-head,.habit{grid-template-columns:35px minmax(0,1fr) 25px 154px 30px;gap:7px}.week{gap:4px}.name{font-size:15px}.emoji{margin-right:5px}.check{width:29px;height:29px}.habit{min-height:62px}.streak{font-size:13px}.score{font-size:14px}}
@media(max-width:460px){body{padding:18px 10px}.widget{padding:23px 14px 18px}.table-head,.habit{grid-template-columns:28px minmax(0,1fr) 22px 119px 27px;gap:5px}.week{gap:3px}.name{font-size:14px;letter-spacing:-.35px}.emoji{display:inline;margin-right:3px}.streak{font-size:12px}.streak span{margin-right:1px}.cell{border-radius:3px}.check{width:26px;height:26px;padding:4px}.day{font-size:12px}h1{font-size:18px}#count{font-size:12px}footer{font-size:12px}.habit{min-height:63px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main><section class="widget" aria-label="Habit Tracker"><header><h1 id="date"></h1><span id="count"></span></header><div class="table-head" aria-hidden="true"><span></span><span></span><span></span><div class="week" id="days"></div><span></span></div><div id="habits"></div><footer><span>過去 7 天</span><span id="storage">只儲存於此瀏覽器</span></footer></section><p class="caption">點選格子補記 · 點選 ✓ 完成今天</p><p class="live" role="status" id="announcement"></p></main>
<script src="app.js"></script></body></html>
